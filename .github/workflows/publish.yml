name: Publish dashboard

on:
  issues:
    types: [opened, edited]
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: publish-dashboard
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.actor == github.repository_owner) ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       github.event.issue.title == 'Publish channel (automated)' &&
       contains(github.event.issue.body, 'land-payload-v1'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Unpack the update from the publishing issue
        if: github.event_name == 'issues'
        shell: python
        run: |
          import base64, json, lzma, os, re
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          body = ev["issue"]["body"] or ""
          m = re.search(r"land-payload-v1\s+([A-Za-z0-9+/=\s]+?)\s*land-end", body)
          if not m:
              raise SystemExit("No payload found in the issue body")
          upd = json.loads(lzma.decompress(base64.b64decode("".join(m.group(1).split()))))
          for path, blob in upd["files"].items():
              if ".." in path or not re.fullmatch(r"(docs|tools)/[A-Za-z0-9_./-]+|README\.md", path):
                  raise SystemExit("Refusing to write " + path)
              if os.path.dirname(path):
                  os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "wb") as f:
                  f.write(lzma.decompress(base64.b64decode(blob)))
          with open(os.path.join(os.environ["RUNNER_TEMP"], "as_of.txt"), "w") as f:
              f.write(str(upd.get("as_of", "")))

      - name: Commit the update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Dashboard update $(cat "$RUNNER_TEMP/as_of.txt" 2>/dev/null)"
            git push
          fi

      - name: Clear any stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(git rev-list --max-count=10 HEAD) ${{ github.sha }}; do
            if gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" >/dev/null 2>&1; then
              echo "Cancelled an unfinished deployment for $sha"
            fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Leave a receipt on the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --body "Published $(cat "$RUNNER_TEMP/as_of.txt") at $(date -u +%Y-%m-%dT%H:%MZ), commit $(git rev-parse --short HEAD). This issue is the publishing channel for the land dashboard."

      - name: Record a failure on the issue
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --body "FAILED to publish at $(date -u +%Y-%m-%dT%H:%MZ). Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
